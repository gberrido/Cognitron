version: '3.8'

services:
  cognitron06-server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: cognitron06-server-prod
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - COGNITRON_SECRET_KEY=${COGNITRON_SECRET_KEY}
      - COGNITRON_HOST=0.0.0.0
      - COGNITRON_PORT=8000
      - COGNITRON_DEBUG=false
      - COGNITRON_LOG_LEVEL=INFO
      - COGNITRON_DATA_DIR=/app/data
    volumes:
      - cognitron06_prod_data:/app/data
      - /var/log/cognitron06:/app/logs
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cognitron06_prod
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: cognitron06-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - cognitron06-server
    restart: always
    networks:
      - cognitron06_prod

  # PostgreSQL for production database
  postgres:
    image: postgres:15-alpine
    container_name: cognitron06-postgres
    environment:
      - POSTGRES_DB=cognitron06
      - POSTGRES_USER=cognitron
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: always
    networks:
      - cognitron06_prod
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Redis for session storage and caching
  redis:
    image: redis:7-alpine
    container_name: cognitron06-redis
    volumes:
      - redis_prod_data:/data
      - ./redis.conf:/etc/redis/redis.conf:ro
    command: redis-server /etc/redis/redis.conf
    restart: always
    networks:
      - cognitron06_prod
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M

volumes:
  cognitron06_prod_data:
    driver: local
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  cognitron06_prod:
    driver: bridge