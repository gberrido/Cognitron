  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   restart: unless-stopped
  #   networks:
  #     - cognitron06

  # Optional: PostgreSQL for production database (future enhancement)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: cognitron06-postgres
  #   environment:
  #     - POSTGRES_DB=cognitron06
