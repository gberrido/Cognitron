version: '3.8'

services:
  cognitron06-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cognitron06-server
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - COGNITRON_SECRET_KEY=${COGNITRON_SECRET_KEY:-your-secret-key-change-in-production}
      - COGNITRON_HOST=0.0.0.0
      - COGNITRON_PORT=8000
      - COGNITRON_DEBUG=false
      - COGNITRON_DATA_DIR=/app/data
    volumes:
      - cognitron06_data:/app/data
      - ./server/src:/app/src:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cognitron06

  # Optional: Redis for session storage and caching (future enhancement)
